<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* THS school colors */
  --maroon:#822336; --maroon-deep:#5c1726; --maroon-tint:#f3e6e9;
  --ink:#1e1719; --muted:#6d5f63; --paper:#fcfafa; --line:#e4d6da;
  --font:"Google Sans Flex","Google Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;

  --bg:var(--paper); --surface:#ffffff; --text:var(--ink);
  --accent:var(--maroon); --accent-hover:var(--maroon-deep); --accent-ink:#ffffff;
  --accent-soft:var(--maroon-tint); --focus:var(--maroon);
  --tile-s:45%; --tile-l:92%; --tile-ink-l:26%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1719; --surface:#2a2023; --text:#f3e6e9; --muted:#b5a5aa; --line:#44343a;
    --accent:#e58aa0; --accent-hover:#f0a6b8; --accent-ink:#1e1719; --accent-soft:#3a1822; --focus:#f0a6b8;
    --tile-s:35%; --tile-l:24%; --tile-ink-l:82%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1719; --surface:#2a2023; --text:#f3e6e9; --muted:#b5a5aa; --line:#44343a;
  --accent:#e58aa0; --accent-hover:#f0a6b8; --accent-ink:#1e1719; --accent-soft:#3a1822; --focus:#f0a6b8;
  --tile-s:35%; --tile-l:24%; --tile-ink-l:82%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center}
.brandwrap{display:flex;align-items:center;gap:10px}
.logo{height:36px;width:auto;flex:none}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.search{flex:1;position:relative;max-width:560px;margin-left:auto}
.search input{width:100%;height:42px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:10px;top:9px;font:500 12px/1 var(--font);border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--muted);background:var(--bg)}
.icon-btn{height:42px;width:42px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:220px 1fr;gap:36px}
.side{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.side h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 10px}
.side ul{list-style:none;margin:0;padding:0}
.side a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.side a:hover{background:var(--surface);color:var(--text)}
.side a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .n{font-variant-numeric:tabular-nums;opacity:.75}

main{min-width:0}
.intro{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.intro p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px/1 var(--font);padding:7px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}

.notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px 14px;margin:0 0 20px;font-size:14px}
.notice.err{border-left-color:#d6453d}
.notice code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}

section.cat{margin:0 0 34px}
section.cat>header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
section.cat h2{margin:0;font-size:22px;letter-spacing:-.015em}
section.cat .count{color:var(--muted);font-size:14px}
.cat-toggle{all:unset;cursor:pointer;margin-left:auto;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:6px}
.cat-toggle:hover{color:var(--text);background:var(--surface)}
.cat-toggle:focus-visible{outline:2px solid var(--focus)}
section.cat.closed .grid{display:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{position:relative;background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;transition:background .12s}
.item:hover{background:var(--accent-soft)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 55% var(--tile-ink-l));overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.item h3 a{text-decoration:none}
.item h3 a::after{content:"";position:absolute;inset:0}
.item p{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.item .t{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;position:relative;z-index:1}
.item .t button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.item .t button:hover{color:var(--accent);border-color:var(--accent)}
.item .t button:focus-visible{outline:2px solid var(--focus)}
.pin{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty button{margin-top:10px}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin-top:10px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:14px;padding-top:14px}
  .side{position:static;max-height:none;overflow:visible}
  .side h2{display:none}
  .side ul{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .side a{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px}
  .side .n{display:none}
  .brand{font-size:17px}
  .search kbd{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brandwrap"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 567.57" role="img" aria-label="T logo"><polygon fill="#fff" points="590 292.25 590 0 0 0 0 292.25 162.97 292.25 162.97 331.22 111.89 331.22 111.89 567.57 478.11 567.57 478.11 331.22 427.03 331.22 427.03 292.25 590 292.25"/><polygon fill="#000" points="565 267.25 565 25 25 25 25 267.25 187.97 267.25 187.97 356.22 136.89 356.22 136.89 542.57 453.11 542.57 453.11 356.22 402.03 356.22 402.03 267.25 565 267.25"/><polygon fill="#d1d3d4" points="535.81 239.29 535.81 52.95 54.19 52.95 54.19 239.29 190.41 239.29 190.41 183.39 217.16 183.39 217.16 384.18 166.08 384.18 166.08 514.61 423.92 514.61 423.92 384.18 372.84 384.18 372.84 183.39 399.6 183.39 399.6 239.29 535.81 239.29"/><polygon fill="#822336" points="343.65 155.44 428.78 155.44 428.78 211.34 506.62 211.34 506.62 80.9 83.38 80.9 83.38 211.34 161.22 211.34 161.22 155.44 246.35 155.44 246.35 412.13 195.27 412.13 195.27 486.66 394.73 486.66 394.73 412.13 343.65 412.13 343.65 155.44"/></svg><h1 class="brand" id="brand">Teaching Resources</h1></div>
    <label class="search">
      <span class="sr" style="position:absolute;left:-9999px">Search resources</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search resources" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <button class="icon-btn" id="reload" title="Reload from sheet" aria-label="Reload from sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="theme" title="Toggle light or dark" aria-label="Toggle light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <nav class="side" aria-label="Categories"><h2>Categories</h2><ul id="nav"></ul></nav>
  <main>
    <div id="notice"></div>
    <div class="intro">
      <p id="sub"></p>
      <div class="tags" id="tagbar" aria-label="Filter by tag"></div>
    </div>
    <div id="content" aria-live="polite"></div>
    <footer id="foot"></footer>
  </main>
</div>

<script>
/* ============================================================
   SETTINGS — edit these two things, then you're done.
   ============================================================ */
const CONFIG = {
  // Paste your published link here (CSV or TSV both work).
  // Leave empty to preview with the built-in sample data.
  CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7lfznY4SovjiJHUdKkGnH3lk8igFLFxjFQv3w2IALXvQeWSEIk3LqFmb6_K9WCIsqZ2rscoQc1XPo/pub?gid=0&single=true&output=tsv",

  TITLE: "Teaching Resources",
  SUBTITLE: "Planning, assessment and classroom tools in one place.",

  // How long (minutes) to reuse the last download before asking the sheet again.
  CACHE_MINUTES: 5
};

/* ============================================================
   SHEET COLUMNS (header names, any order, case-insensitive)
   category     – section the link belongs to           (required)
   title        – name shown                            (required)
   url          – where it goes (https://…)             (required)
   description  – one short line                        (optional)
   tags         – comma-separated, e.g. "forms, hr"     (optional)
   icon         – an emoji, or an image URL             (optional)
   order        – number; lower shows first in category (optional)
   pinned       – yes/true/1 to show in "Pinned" at top (optional)
   hidden       – yes/true/1 to hide without deleting   (optional)
   Any other columns are ignored, so you can keep private notes.
   Categories appear in the order they first show up in the sheet.
   ============================================================ */

const SAMPLE_CSV = `category,title,url,description,tags,icon,order,pinned,hidden
Planning,Learning Targets,https://YOUR-USERNAME.github.io/learning-targets/,Write and organize learning targets for each unit,"teacher, planning, master sheet",🎯,1,,
Planning,Lesson Plans,https://YOUR-USERNAME.github.io/lesson-plans/,Build and browse lesson plans,"teacher, planning, master sheet",📝,2,,
Assessment,Standards Dashboard,https://YOUR-USERNAME.github.io/standards-dashboard/,See how students are doing on each standard,"teacher, data, master sheet",📊,1,yes,
Assessment,Grade Check for Students,https://YOUR-USERNAME.github.io/grade-check/,Students look up their own grades,"students, data",✅,2,yes,
Classroom,Seating Chart,https://YOUR-USERNAME.github.io/seating-chart/,Arrange and save seating by class period,"teacher, classroom",🪑,1,,
Data,Master Sheet,https://docs.google.com/spreadsheets/d/YOUR-SHEET-ID/edit,"The Google Sheet behind Learning Targets, Lesson Plans and the Standards Dashboard","teacher, master sheet",🗂️,1,yes,`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const state = { items: [], q: "", tag: null, source: "", fetchedAt: null };
const LS = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

function parseCSV(text){
  const first=text.replace(/^\uFEFF/,"").split(/\r?\n/)[0]||"";
  const D = first.includes("\t") ? "\t" : ",";   // TSV or CSV, detected automatically
  // Handles tab- or comma-separated text, quoted fields, escaped quotes (""), commas and line breaks inside quotes.
  const rows=[]; let row=[], field="", inQ=false;
  text = text.replace(/^\uFEFF/, "");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++ } else inQ=false }
      else field+=c;
    } else if(c==='"') inQ=true;
    else if(c===D){ row.push(field); field="" }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(field); field="";
      if(row.some(x=>x.trim()!=="")) rows.push(row);
      row=[];
    } else field+=c;
  }
  row.push(field);
  if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}

const truthy = v => /^(1|y|yes|true|x|✓|pin|pinned)$/i.test((v||"").trim());

function toItems(csv){
  const rows = parseCSV(csv);
  if(rows.length<2) return [];
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  const idx = {};
  ["category","title","url","description","tags","icon","order","pinned","hidden"].forEach(n=>idx[n]=col(n));
  if(idx.title<0 || idx.url<0) throw new Error("The sheet needs at least 'title' and 'url' columns in the first row.");
  const get=(r,n)=> idx[n]>=0 ? (r[idx[n]]||"").trim() : "";
  const out=[];
  rows.slice(1).forEach((r,i)=>{
    const title=get(r,"title"), url=get(r,"url");
    if(!title || !url || truthy(get(r,"hidden"))) return;
    if(!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) return;   // only safe links
    const ord = parseFloat(get(r,"order"));
    out.push({
      category:get(r,"category")||"Other",
      title, url,
      description:get(r,"description"),
      tags:get(r,"tags").split(",").map(t=>t.trim()).filter(Boolean),
      icon:get(r,"icon"),
      order:isNaN(ord)?Infinity:ord,
      pinned:truthy(get(r,"pinned")),
      row:i
    });
  });
  return out;
}

function hue(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return h }
const slug = s => "c-"+s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* ---------- loading ---------- */
async function load(force=false){
  const btn=$("#reload"); btn.classList.add("spin");
  const url = new URLSearchParams(location.search).get("sheet") || CONFIG.CSV_URL;
  state.notice = null;
  try{
    if(!url){
      state.items = toItems(SAMPLE_CSV);
      state.source = "sample";
      state.notice = {html:"This is sample data with placeholder links. Publish your sheet as CSV and paste the link into <code>CSV_URL</code> near the top of this file.", err:false};
    } else {
      const key="hub-cache:"+url, tkey=key+":t";
      const cached = LS.get(key), t = +LS.get(tkey)||0;
      let text=null;
      if(!force && cached && Date.now()-t < CONFIG.CACHE_MINUTES*60000){ text=cached; state.source="cache" }
      else{
        try{
          const res = await fetch(url,{cache:"no-store"});
          if(!res.ok) throw new Error("HTTP "+res.status);
          text = await res.text();
          if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("That link returned a web page, not CSV.");
          LS.set(key,text); LS.set(tkey,String(Date.now()));
          state.source="sheet";
        }catch(e){
          if(cached){ text=cached; state.source="cache";
            state.notice={html:"Couldn't reach the sheet ("+esc(e.message)+"). Showing the last saved copy.",err:true};
          } else throw e;
        }
      }
      state.items = toItems(text);
    }
    state.fetchedAt = new Date();
  }catch(e){
    state.items=[];
    state.notice={html:"Couldn't load the sheet: "+esc(e.message)+". Check that it's published as CSV and the link is correct.",err:true};
  }
  btn.classList.remove("spin");
  render();
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- rendering ---------- */
function matches(it){
  if(state.tag && !it.tags.some(t=>t.toLowerCase()===state.tag)) return false;
  if(!state.q) return true;
  const hay=(it.title+" "+it.description+" "+it.category+" "+it.tags.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}

function itemEl(it){
  const el=document.createElement("div"); el.className="item";
  const tile=document.createElement("div"); tile.className="tile";
  tile.style.setProperty("--h", hue(it.category));
  const ic=it.icon;
  if(/^https?:\/\//i.test(ic)){ const im=document.createElement("img"); im.src=ic; im.alt=""; im.loading="lazy"; im.referrerPolicy="no-referrer";
    im.onerror=()=>{ tile.textContent=it.title.charAt(0).toUpperCase() }; tile.appendChild(im) }
  else tile.textContent = ic || it.title.charAt(0).toUpperCase();
  const body=document.createElement("div");
  const h=document.createElement("h3"); const a=document.createElement("a");
  a.href=it.url; a.textContent=it.title; a.target="_blank"; a.rel="noopener noreferrer"; h.appendChild(a);
  body.appendChild(h);
  if(it.description){ const p=document.createElement("p"); p.textContent=it.description; body.appendChild(p) }
  if(it.tags.length){
    const t=document.createElement("div"); t.className="t";
    it.tags.forEach(tag=>{ const b=document.createElement("button"); b.type="button"; b.textContent=tag;
      b.onclick=()=>{ state.tag=tag.toLowerCase(); render(); window.scrollTo({top:0}) }; t.appendChild(b) });
    body.appendChild(t);
  }
  el.append(tile,body); return el;
}

const closed = new Set(JSON.parse(LS.get("hub-closed")||"[]"));

function render(){
  document.title = CONFIG.TITLE;
  $("#brand").textContent = CONFIG.TITLE;
  $("#sub").textContent = CONFIG.SUBTITLE;

  const n=$("#notice"); n.innerHTML="";
  if(state.notice){ const d=document.createElement("div"); d.className="notice"+(state.notice.err?" err":""); d.innerHTML=state.notice.html; n.appendChild(d) }

  // tag bar
  const allTags=[...new Set(state.items.flatMap(i=>i.tags.map(t=>t.toLowerCase())))].sort();
  const tb=$("#tagbar"); tb.innerHTML="";
  if(allTags.length>1 || state.tag){
    allTags.forEach(t=>{ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=t;
      b.setAttribute("aria-pressed", state.tag===t); b.onclick=()=>{ state.tag = state.tag===t?null:t; render() }; tb.appendChild(b) });
  }

  const vis=state.items.filter(matches);
  const content=$("#content"); content.innerHTML="";
  const navEl=$("#nav"); navEl.innerHTML="";

  if(!vis.length){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML = state.items.length
      ? "<p>No resources match that search.</p>"
      : "<p>No resources to show yet. Add rows to your sheet with a category, title and url.</p>";
    if(state.q||state.tag){ const b=document.createElement("button"); b.className="btn"; b.textContent="Clear search and filters";
      b.onclick=()=>{ state.q=""; state.tag=null; $("#q").value=""; render() }; e.appendChild(b) }
    content.appendChild(e);
  } else {
    // groups in order of first appearance in the sheet
    const groups=new Map();
    vis.forEach(it=>{ if(!groups.has(it.category)) groups.set(it.category,[]); groups.get(it.category).push(it) });
    const list=[];
    const pinned=vis.filter(i=>i.pinned);
    if(pinned.length && !state.q && !state.tag) list.push(["Pinned",pinned.slice().sort(cmp),true]);
    groups.forEach((arr,name)=>list.push([name,arr.slice().sort(cmp),false]));

    list.forEach(([name,arr,isPinned])=>{
      const id=slug(name);
      const sec=document.createElement("section"); sec.className="cat"+(closed.has(name)?" closed":""); sec.id=id;
      const hd=document.createElement("header");
      const h=document.createElement("h2");
      if(isPinned){ const d=document.createElement("span"); d.className="pin"; h.appendChild(d) }
      h.appendChild(document.createTextNode(name));
      const c=document.createElement("span"); c.className="count"; c.textContent=arr.length;
      const tg=document.createElement("button"); tg.className="cat-toggle"; tg.type="button";
      tg.textContent=closed.has(name)?"Show":"Hide"; tg.setAttribute("aria-expanded",!closed.has(name));
      tg.onclick=()=>{ closed.has(name)?closed.delete(name):closed.add(name); LS.set("hub-closed",JSON.stringify([...closed])); render() };
      hd.append(h,c,tg);
      const grid=document.createElement("div"); grid.className="grid";
      arr.forEach(it=>grid.appendChild(itemEl(it)));
      sec.append(hd,grid); content.appendChild(sec);

      const li=document.createElement("li"); const a=document.createElement("a"); a.href="#"+id;
      a.innerHTML="<span></span><span class='n'></span>"; a.children[0].textContent=name; a.children[1].textContent=arr.length;
      li.appendChild(a); navEl.appendChild(li);
    });
    spy();
  }

  const f=$("#foot");
  f.textContent = state.items.length
    ? state.items.length+" resources"+(state.source==="sheet"?" · loaded from your sheet "+state.fetchedAt.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):state.source==="cache"?" · saved copy":" · sample data")
    : "";
}
const cmp=(a,b)=> a.order-b.order || a.row-b.row;

/* highlight current category in the sidebar */
let io;
function spy(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll("#nav a")];
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.removeAttribute("aria-current"));
      const l=links.find(l=>l.getAttribute("href")==="#"+e.target.id); if(l) l.setAttribute("aria-current","true") } });
  },{rootMargin:"-90px 0px -65% 0px"});
  document.querySelectorAll("section.cat").forEach(s=>io.observe(s));
}

/* ---------- events ---------- */
$("#q").addEventListener("input",e=>{ state.q=e.target.value.trim(); render() });
$("#reload").addEventListener("click",()=>load(true));
document.addEventListener("keydown",e=>{
  if(e.key==="/" && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus() }
  if(e.key==="Escape" && document.activeElement===$("#q")){ $("#q").value=""; state.q=""; render(); $("#q").blur() }
});
$("#theme").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; LS.set("hub-theme",next);
});
const savedTheme=LS.get("hub-theme"); if(savedTheme) document.documentElement.dataset.theme=savedTheme;

load();
</script>
